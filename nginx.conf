server {
    listen 80;
    listen [::]:80;
    server_name www.lapnet.com.la lapnet.com.la;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lapnet.com.la lapnet.com.la;

    # SSL Certificate (ปรับ path ให้ตรงกับ server)
    ssl_certificate     /etc/letsencrypt/live/lapnet.com.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lapnet.com.la/privkey.pem;

    # Root directory (ปรับให้ตรงกับที่ deploy ไว้)
    root /var/www/lapnet/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitemap และ robots.txt ไม่ cache
    location ~* \.(xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML / SPA shell must not be cached, otherwise browsers can keep pointing
    # to old hashed JS/CSS bundles after a new deployment.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /index.html =404;
    }

    # SPA — redirect ทุก route กลับมาที่ index.html
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
